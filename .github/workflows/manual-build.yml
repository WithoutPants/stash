name: Manual build

on:
  workflow_dispatch:
    inputs:
      refToBuild:
        description: 'Commit SHA1'
        required: true
        default: ''
        type: string

jobs:
  setup:
    runs-on: ubuntu-22.04
    container: 
      image: stashapp/compiler:11
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.refToBuild }}

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Cache node modules
      uses: actions/cache@v3
      env:
        cache-name: cache-node_modules
      with:
        path: ui/v2.5/node_modules
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('ui/v2.5/yarn.lock') }}

    - name: Cache UI build
      uses: actions/cache@v3
      id: cache-ui
      env:
        cache-name: cache-ui
      with:
        path: ui/v2.5/build
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('ui/v2.5/yarn.lock', 'ui/v2.5/public/**', 'ui/v2.5/src/**', 'graphql/**/*.graphql') }}

    - name: Make .go-cache directory
      run: |
        mkdir -p .go-cache

    - name: Pre-install
      run: make pre-ui

    - name: Generate
      run: make generate

    - name: Validate UI
      run: make validate-ui

    # Static validation happens in the linter workflow in parallel to this workflow
    # Run Dynamic validation here, to make sure we pass all the projects integration tests
    - name: Test Backend
      run: make it

    - name: Build UI
      # include source maps
      env:
        STASH_SOURCEMAPS: 'true'
      run: make ui

    # upload artifacts produced by setup so matrix jobs can reuse them
    - name: Upload UI build
      uses: actions/upload-artifact@v4
      with:
        name: ui-build
        path: ui/v2.5/build

    - name: Upload generated files
      uses: actions/upload-artifact@v4
      with:
        name: generated-files
        path: |
          internal/api/generated_exec.go
          internal/api/generated_models.go
          ui/v2.5/src/core/generated-graphql.ts

    - name: Zip UI
      run: |
        mkdir -p dist
        make zip-ui

    - name: Upload UI
      uses: actions/upload-artifact@v4
      with:
        name: stash-ui.zip
        path: dist/stash-ui.zip

  compile:
    needs: setup

    runs-on: ubuntu-22.04
    container: 
      image: stashapp/compiler:11

    strategy:
      matrix:
        platform: [ windows, macos, linux, linux-arm64v8, linux-arm32v7, linux-arm32v6, freebsd ]
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.refToBuild }}
    
    - name: Download UI build
      uses: actions/download-artifact@v5
      with:
        name: ui-build
        path: ui/v2.5/build

    - name: Download generated files
      uses: actions/download-artifact@v5
      with:
        name: generated-files
        path: .

    - name: Compile for all supported platforms
      run: |
        git config --global --add safe.directory /__w/stash/stash
        make build-cc-${{ matrix.platform }}

    - name: Upload compiled dist
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.platform }}
        path: dist

    - name: Generate checksums
      run: |
        git describe --tags --exclude latest_develop | tee CHECKSUMS_SHA1
        sha1sum dist/* | sed 's/dist\///g' | tee -a CHECKSUMS_SHA1
        echo "STASH_VERSION=$(git describe --tags --exclude latest_develop)" >> $GITHUB_ENV
        echo "RELEASE_DATE=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_ENV
